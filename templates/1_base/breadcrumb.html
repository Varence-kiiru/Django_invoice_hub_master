<!-- Breadcrumb Navigation Component
     Do not edit this template directly. Breadcrumbs are passed from views.

     Expected context structure:
     breadcrumbs = [
       {'label': 'Dashboard', 'url': '/dashboard/'},
       {'label': 'Users', 'url': '/users/'},
       {'label': 'John Doe', 'url': ''}  # Empty URL = current page
     ]
-->

{% if breadcrumbs %}
<nav class="breadcrumb-nav" aria-label="breadcrumb">
  <ol class="breadcrumb-list">
    {% for item in breadcrumbs %}
      <li class="breadcrumb-item">
        {% if item.url %}
          <a href="{{ item.url }}" class="breadcrumb-link">{{ item.label }}</a>
        {% else %}
          <span class="breadcrumb-current">{{ item.label }}</span>
        {% endif %}
        {% if not forloop.last %}<span class="breadcrumb-separator">/</span>{% endif %}
      </li>
    {% endfor %}
  </ol>
</nav>
{% endif %}
