<!-- Add Invoice Line Items Modal -->
<div id="line-items-modal" class="modal" style="display: none;">
  <div class="modal-overlay"></div>
  <div class="modal-content modal-large">
    <div class="modal-header">
      <h2>Add Line Item</h2>
      <button class="modal-close" onclick="closeLineItemsModal()">&times;</button>
    </div>
    <div class="modal-body">
      <form id="add-line-item-form" method="post">
        {% csrf_token %}

        <div class="form-group">
          <label for="modal-product">Product/Service</label>
          <select id="modal-product" name="product" class="form-control">
            <option value="">--- Select Product ---</option>
          </select>
        </div>

        <div class="form-group">
          <label for="modal-description">Description</label>
          <input type="text" id="modal-description" name="description" placeholder="Item description" class="form-control">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="modal-quantity">Quantity</label>
            <input type="number" id="modal-quantity" name="quantity" value="1" min="0.01" step="0.01" class="form-control">
          </div>

          <div class="form-group">
            <label for="modal-unit-price">Unit Price</label>
            <input type="number" id="modal-unit-price" name="unit_price" value="0" min="0" step="0.01" class="form-control">
          </div>

          <div class="form-group">
            <label for="modal-tax-rate">Tax Rate %</label>
            <input type="number" id="modal-tax-rate" name="tax_rate" value="0" min="0" max="100" step="0.01" class="form-control">
          </div>
        </div>

        <div class="form-group">
          <label>Line Total</label>
          <div style="background: rgba(0,0,0,0.05); padding: 12px; border-radius: 4px; font-size: 16px; font-weight: bold;">
            <span id="modal-line-total-currency">KES</span>&nbsp;<span id="modal-line-total">0.00</span>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeLineItemsModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitLineItem()">➕ Add Item</button>
    </div>
  </div>
</div>

<style>
  .modal-large {
    max-width: 600px;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 15px;
  }

  @media (max-width: 768px) {
    .form-row {
      grid-template-columns: 1fr;
    }
  }
</style>
