<!-- Product Form Modal -->
<!-- Used for quick product editing and creation -->
<div class="modal fade" id="productFormModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="productModalTitle">New Product</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="productForm" method="post" class="needs-validation">
                {% csrf_token %}
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="modalProductSKU" class="form-label">SKU <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="modalProductSKU" name="sku" required>
                    </div>

                    <div class="mb-3">
                        <label for="modalProductName" class="form-label">Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="modalProductName" name="name" required>
                    </div>

                    <div class="mb-3">
                        <label for="modalProductPrice" class="form-label">Price <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" class="form-control" id="modalProductPrice" name="unit_price" 
                                   step="0.01" min="0" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="modalProductCategory" class="form-label">Category</label>
                        <select class="form-control" id="modalProductCategory" name="category">
                            <option value="">Select Category...</option>
                            <!-- Populated by JavaScript -->
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="modalProductTaxClass" class="form-label">Tax Class <span class="text-danger">*</span></label>
                        <select class="form-control" id="modalProductTaxClass" name="tax_class" required>
                            <option value="">Select Tax Class...</option>
                            <!-- Populated by JavaScript -->
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Product</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Category Quick Add Modal -->
<!-- For creating categories without leaving current page -->
<div class="modal fade" id="categoryQuickAddModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">New Category</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="categoryForm" method="post" action="{% url 'products:category-create' %}">
                {% csrf_token %}
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="modalCategoryName" class="form-label">Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="modalCategoryName" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="modalCategoryDescription" class="form-label">Description</label>
                        <textarea class="form-control" id="modalCategoryDescription" name="description" rows="2"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create Category</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Tax Class Quick Add Modal -->
<!-- For creating tax classes without leaving current page -->
<div class="modal fade" id="taxClassQuickAddModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">New Tax Class</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="taxClassForm" method="post" action="{% url 'products:tax-class-create' %}">
                {% csrf_token %}
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="modalTaxClassName" class="form-label">Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="modalTaxClassName" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="modalTaxClassType" class="form-label">VAT Type <span class="text-danger">*</span></label>
                        <select class="form-control" id="modalTaxClassType" name="rate_type" required>
                            <option value="">Select VAT Type...</option>
                            <option value="standard">Standard VAT (16%)</option>
                            <option value="zero">Zero-Rated (0%)</option>
                            <option value="exempt">Exempt (no VAT)</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create Tax Class</button>
                </div>
            </form>
        </div>
    </div>
</div>
