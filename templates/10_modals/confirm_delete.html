<!-- Enhanced Delete Confirmation Modal (Custom Modal System) -->
<div id="confirmDeleteModal" class="modal" role="dialog" aria-labelledby="confirmDeleteLabel" aria-hidden="true" style="display: none;">
  <div class="modal-overlay"></div>
  <div class="modal-dialog modal-md" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="confirmDeleteLabel">
          <span aria-hidden="true">⚠️</span> Confirm Delete
        </h5>
        <button type="button" class="modal-close" onclick="hideModal(document.getElementById('confirmDeleteModal'))" aria-label="Close">&times;</button>
      </div>

      <div class="modal-body">
        <!-- Item Title -->
        <h6 id="deleteItemTitle" class="mb-3" style="color: #212529; font-weight: 600;"></h6>

        <!-- Main Message -->
        <p id="deleteMessage" class="mb-3">This action cannot be undone. Are you sure?</p>

        <!-- Item Details (Optional) -->
        <div id="deleteItemDetails" class="alert alert-info mb-3" style="display: none;">
          <!-- Dynamically populated -->
        </div>

        <!-- Warning Message (Optional) -->
        <div id="deleteWarning" class="alert alert-warning mb-3" style="display: none;">
          <strong>⚠️ Warning:</strong>
          <span id="warningText"></span>
        </div>

        <!-- Danger Alert -->
        <div class="alert alert-danger mb-3" role="alert">
          <span aria-hidden="true">🔒</span>
          <span>This action cannot be undone.</span>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="hideModal(document.getElementById('confirmDeleteModal'))">Cancel</button>
        <form id="deleteForm" method="POST" style="display: inline;">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">
            <span aria-hidden="true">✕</span> Delete
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
// Enhanced Delete Modal Handler with proper event delegation and cleanup
let deleteModalListener = null; // Track listener reference for cleanup

function initializeDeleteModal() {
  const modal = document.getElementById('confirmDeleteModal');
  if (!modal) return;

  // Remove old listener if it exists
  if (deleteModalListener) {
    document.removeEventListener('click', deleteModalListener);
  }

  // Create handler for delete modal
  deleteModalListener = function(e) {
    // Close modal when overlay is clicked
    if (e.target.id === 'confirmDeleteModal' || e.target.classList.contains('modal-overlay')) {
      hideModal(modal);
      return;
    }

    // Only handle clicks on delete buttons
    const deleteBtn = e.target.closest('.btn-delete');
    if (!deleteBtn) return;

    e.preventDefault();
    e.stopPropagation();

    const deleteUrl = deleteBtn.getAttribute('data-delete-url') || deleteBtn.getAttribute('href');
    const itemName = deleteBtn.getAttribute('data-item-name') || 'item';
    const itemType = deleteBtn.getAttribute('data-item-type') || 'Item';
    const message = deleteBtn.getAttribute('data-message') || 'Are you sure you want to delete this ' + itemType.toLowerCase() + '?';
    const details = deleteBtn.getAttribute('data-details');
    const warning = deleteBtn.getAttribute('data-warning');

    // Set title and main message
    document.getElementById('deleteItemTitle').textContent = `Delete ${itemName}?`;
    document.getElementById('deleteMessage').textContent = message;

    // Set form action
    document.getElementById('deleteForm').action = deleteUrl;

    // Handle item details
    const detailsContainer = document.getElementById('deleteItemDetails');
    if (details) {
      try {
        const detailsObj = JSON.parse(details);
        let detailsHtml = '';
        for (const [key, value] of Object.entries(detailsObj)) {
          detailsHtml += `<div class="mb-2"><strong>${key}:</strong> ${value}</div>`;
        }
        detailsContainer.innerHTML = detailsHtml;
        detailsContainer.style.display = 'block';
      } catch (e) {
        detailsContainer.style.display = 'none';
      }
    } else {
      detailsContainer.style.display = 'none';
    }

    // Handle warning
    const warningContainer = document.getElementById('deleteWarning');
    if (warning) {
      document.getElementById('warningText').textContent = warning;
      warningContainer.style.display = 'block';
    } else {
      warningContainer.style.display = 'none';
    }

    // Show modal using custom modal system
    showModal(modal);
  };

  // Add the listener
  document.addEventListener('click', deleteModalListener);
}

// Initialize delete modal on page load and when DOM changes
document.addEventListener('DOMContentLoaded', initializeDeleteModal);

// Handle form submission
document.addEventListener('DOMContentLoaded', function() {
  const deleteForm = document.getElementById('deleteForm');
  if (deleteForm) {
    deleteForm.addEventListener('submit', function(e) {
      // Form will submit normally to the delete endpoint
      // The POST handler in the view will process it
    });
  }
});

// Re-initialize modal handler when dynamic content is loaded (e.g., after AJAX)
document.addEventListener('contentUpdated', initializeDeleteModal);
</script>
